name: Баг
description: Что-то работает не так, как ожидалось
labels: ['type:bug', 'status:todo']
body:
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Команды целиком, в том порядке, в котором они приводят к проблеме.
      placeholder: |
        1. `pnpm install`
        2. `node scripts/cycle-gates.mjs --dir <каталог>`
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
      description: |
        Ссылка на норматив: `docs/protocol.md`, `docs/orchestrator-core.md`, `docs/workflow.md`.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
      description: |
        Код выхода, stderr и имя артефакта. Содержимое `.env*` и пользовательские данные
        не вставлять: диагностика ядра их не печатает, копия в issue — утечка.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Где воспроизводится
      placeholder:
        локально / CI, версия node, commit sha, версия пакета (если установлен как зависимость)
  - type: dropdown
    id: severity
    attributes:
      label: Серьёзность
      options:
        - 'p1 — блокер (ядро не запускается, артефакты не пишутся, утечка секретов)'
        - 'p2 — заметно мешает'
        - 'p3 — косметика'
    validations:
      required: true
