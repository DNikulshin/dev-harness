name: CI

on:
  push:
    branches: [main]
    # Тег — контракт для потребителя: по нему ставится пакет (`#vX.Y.Z`). CI на теге
    # должен быть зелёным, иначе ссылка на тег ведёт на непроверенный коммит.
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # Матрица ОС — заявленное обещание `os: ["linux", "darwin"]` в package.json (#68):
    # процесс-группы в cycle-gates POSIX-ориентированы, Windows не поддерживается.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Версия pnpm берётся из packageManager в package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Проверка типов
        run: pnpm typecheck

      # Типы для потребителя пакета коммитятся: генерируются из JSDoc и сверяются здесь.
      - name: Типы пакета актуальны
        run: pnpm typecheck:types:check

      - name: Тесты ядра
        run: pnpm test

      - name: Форматирование
        run: pnpm format:check

      # Проверка раскладки harness на самом репозитории: .pi/agents, .pi/settings.json, cycle.md.
      - name: Проверка harness (H1–H6)
        run: node scripts/check-harness.mjs
