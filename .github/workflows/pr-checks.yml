name: PR checks

# Проверка связи PR с issue: в теле должна быть строка `Closes #<номер>`.
#
# Зачем: GitHub связывает issue в момент мержа по ключевому слову в теле PR. Если тело собрано
# из шаблона (`Closes #` без номера) или из сообщения коммита, issue остаётся открытым, а доска
# показывает прежнюю колонку — так и вышло с #5 и #15. Проверка делает это состояние
# невозможным: без ссылки обязательный чек не пройдёт (см. docs/workflow.md).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-references:
    # PR от Dependabot не ссылаются на issue: задачи в трекере у бота нет, тело он не правит.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # История нужна целиком: проверка читает сообщения коммитов PR (`base..head`), а не только
      # тело — GitHub закрывает issue и по closing-слову в коммите (#181).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Логика — tooling/pr-reference.mjs (чистые функции, покрыты node --test):
      # HTML-комментарии и блоки кода не считаются ссылками, иначе подсказка шаблона
      # «Closes #<номер>» проходила бы проверку, ничего не закрывая. Плюс сообщения коммитов:
      # closing-слово с номером вне тела PR закрыло бы чужой issue при мерже (#181).
      - name: Ссылка на issue в теле PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tooling/pr-reference.mjs
