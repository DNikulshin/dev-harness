name: Board sync

# Полная сверка доски GitHub Projects с issues: карточки добавляются, колонка Status выводится
# из меток status:* и из закрытия issue. Логика — `tooling/board-sync.mjs` (правила доски —
# чистые функции, покрыты `node --test`).
#
# Почему отдельным workflow: карточки и поле Status в Projects v2 недоступны GITHUB_TOKEN,
# нужен PAT `PROJECT_TOKEN` (как создать — `docs/board.md`). Пока секрета нет, джоба падает
# с инструкцией: молчаливый пропуск расходится с репозиторием, а прогон остаётся зелёным.
on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  schedule:
    # Страховка: события могли не дойти, проект правили руками, токен менялся.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Параллельные прогоны гоняли бы одни и те же карточки: собираем их в очередь.
concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  sync:
    # Полная сверка нужна не на каждую метку: `type:*`, `area:*`, `prio:*`, `size:*`
    # на колонку не влияют, а событий от них много. Колонку двигают только `status:*`
    # (их же ставит `board-labels.yml`), поэтому остальные метки прогон не запускают.
    # PR из форка не получает секретов — синк там всё равно не выполнить.
    if: |
      (github.event_name != 'issues'
        || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
        || startsWith(github.event.label.name, 'status:'))
      && (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      # `@me`, а не `github.repository_owner`: `gh project … --owner <login>` сначала определяет
      # тип владельца запросом `user(login:)`, а fine-grained PAT такого запроса не получает
      # и gh падает с «unknown owner type». `@me` резолвится через `viewer` и работает с обоими
      # типами токена; репозиторий задан отдельно (REPO).
      OWNER: '@me'
      REPO: ${{ github.repository }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Проверить, что PROJECT_TOKEN и PROJECT_NUMBER заданы
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Секрет PROJECT_TOKEN не задан — доска не синхронизируется."
            echo "Как создать PAT и положить в секрет: docs/board.md, «Секрет PROJECT_TOKEN»."
            exit 1
          fi
          if [ -z "$PROJECT_NUMBER" ]; then
            echo "::error::Переменная репозитория PROJECT_NUMBER не задана — номер доски неизвестен."
            echo "Задать: gh variable set PROJECT_NUMBER --body <номер>. Подробности: docs/board.md."
            exit 1
          fi

      - name: Синхронизировать доску Projects
        run: node tooling/board-sync.mjs
